# OpenSSF Scorecard — scores the repo's supply-chain security posture (branch
# protection, pinned deps, token permissions, dangerous workflows, …) and uploads
# results to the Security tab + the public OSSF API that backs the README badge.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout in private/locked-down repos
      security-events: write # upload the SARIF result to the Security tab
      id-token: write # publish results to OSSF (powers the badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
