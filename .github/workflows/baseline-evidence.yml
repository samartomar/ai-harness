name: baseline-evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job keeps the name `vet-once` deliberately. It no longer runs the
  # from-scratch vet, but the name is referenced by required-check
  # configuration, and renaming it would wedge that list in "expected".
  vet-once:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ai-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The from-scratch re-vet used to run here, on every push and on any PR a
      # path pattern judged relevant. It no longer does, and the reason is that
      # it could not tell us anything.
      #
      # Every input the vet consumes is content-addressed: sources by commit
      # SHA, SkillSpector by image digest, the scanner environments by
      # hash-pinned uv.lock, aih-native by a content digest over its own source
      # closure. Between two runs at an unchanged pin set there is nothing that
      # can differ except the machine, so repeating the scan did not re-test the
      # supply chain -- it sampled the runner image. Content-addressed evidence
      # does not expire: a receipt asserts "these exact bytes, scanned by these
      # exact analyzers, produced this verdict", and that does not become less
      # true with time.
      #
      # So a green vet now stands until a pin moves, and the moment one moves it
      # becomes critical. Two cheap checks below decide which of those we are in:
      # `check:baseline-pins` compares the pin set this build DECLARES against
      # the pin set the committed lock RECORDED, and `baseline:check` proves the
      # lock still reproduces from the pinned sources. The expensive
      # from-scratch run is owned by the vet fleet and happens exactly when the
      # first check fires -- see docs/security/baseline-evidence.md.
      #
      # Because both checks are cheap, the old path-pattern relevance gate is
      # gone. It existed only to dodge a ~1 h cost, and inferring "did a pin
      # move" from which files a diff touched was always a proxy for the fact
      # that `check:baseline-pins` now measures directly.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Pin currency runs BEFORE any analyzer provisioning: if the committed
      # evidence describes a different pin set, nothing downstream can be
      # trusted, and failing here explains that in one cheap step.
      - name: Fail closed if the committed evidence is not current for the declared pins
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run check:baseline-pins

      - name: Set up scanner Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pull and verify pinned SkillSpector image by digest
        shell: bash
        run: |
          set -euo pipefail
          # Content-addressed pull: the tag below is a public GHCR package, so no
          # docker login or packages: permission is needed. Re-tag to the local
          # runtime name so SKILLSPECTOR_IMAGE selection (src/trust/images.ts)
          # keeps working unmodified. Verification checks RepoDigests rather than
          # `.Id`, so it is correct regardless of the runner's Docker image-store
          # type (containerd snapshotter vs legacy graphdriver).
          image="ghcr.io/samartomar/skillspector@sha256:c5d4a1816419f129ae85ff96b3e366d4a062c1859997e26b7ab87341a43d4800"
          docker pull "$image"
          docker tag "$image" skillspector:aih-2d198ab910ad
          digests="$(docker image inspect skillspector:aih-2d198ab910ad --format '{{json .RepoDigests}}')"
          echo "repo digests: ${digests}"
          echo "$digests" | grep -q "sha256:c5d4a1816419f129ae85ff96b3e366d4a062c1859997e26b7ab87341a43d4800"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          cache-dependency-glob: |
            tools/cisco-skill-scanner/uv.lock
            tools/trust-scanners/semgrep/uv.lock
            tools/trust-scanners/snyk-agent-scan/uv.lock
            tools/trust-scanners/cisco-mcp/uv.lock
      - name: Cache and verify pinned Cisco skill-scanner
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tools/cisco-skill-scanner --locked --isolated --python 3.12 \
            --no-python-downloads --no-env-file skill-scanner --version
          version="$(uv run --project tools/cisco-skill-scanner --locked --isolated --python 3.12 \
            --offline --no-python-downloads --no-env-file skill-scanner --version)"
          test "$version" = "skill-scanner 2.0.13"
      - name: Cache and verify supplemental locked scanners
        shell: bash
        run: |
          set -euo pipefail
          uv run --project tools/trust-scanners/semgrep --locked --isolated --python 3.12 \
            --no-python-downloads --no-env-file semgrep --version
          semgrep_version="$(uv run --project tools/trust-scanners/semgrep \
            --locked --isolated --python 3.12 --offline --no-python-downloads --no-env-file \
            semgrep --version)"
          test "$semgrep_version" = "1.173.0"
          uv run --project tools/trust-scanners/snyk-agent-scan --locked --isolated --python 3.12 \
            --no-python-downloads --no-env-file snyk-agent-scan help >/dev/null
          uv run --project tools/trust-scanners/snyk-agent-scan --locked --isolated \
            --python 3.12 --offline --no-python-downloads --no-env-file \
            snyk-agent-scan help >/dev/null
          uv run --project tools/trust-scanners/cisco-mcp --locked --isolated --python 3.12 \
            --no-python-downloads --no-env-file mcp-scanner --help >/dev/null
          uv run --project tools/trust-scanners/cisco-mcp --locked --isolated \
            --python 3.12 --offline --no-python-downloads --no-env-file \
            mcp-scanner --help >/dev/null
      - name: Check out exact ECC baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: affaan-m/ecc
          ref: 623f2c020f052319657674e4e6c29ab5d0ad566b
          path: .baseline-sources/ecc
          persist-credentials: false
      - name: Check out exact Superpowers baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: obra/Superpowers
          ref: 3dcbd5c4b48e02263fbf4a3c01e3fe4f81d584d9
          path: .baseline-sources/superpowers
          persist-credentials: false

      # Reproduction, not rescan. `baseline:check` re-derives the lock from the
      # pinned sources with the full required-analyzer floor and byte-compares.
      # Receipts are reused ONLY where the component tree hash AND the analyzer
      # identity both match, so any content or analyzer change still forces a
      # genuine rescan of exactly the affected components. What it stops doing is
      # re-proving unchanged content, which is the part that cost an hour and
      # could not have changed.
      - name: Regenerate every receipt for a manually dispatched full re-vet
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "vet-head=$(git rev-parse HEAD)"
          npm run check:native-identity
          npm run baseline:vet -- \
            --full \
            --ecc-root .baseline-sources/ecc \
            --superpowers-root .baseline-sources/superpowers
          sha256sum \
            src/baseline-evidence/vendor-lock.json \
            src/baseline-evidence/ecc-install-preview.json
      - name: Prove the committed lock still reproduces from the pinned sources
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run baseline:check -- \
            --ecc-root .baseline-sources/ecc \
            --superpowers-root .baseline-sources/superpowers
      - name: Upload baseline evidence report
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || success()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-evidence-lock
          path: |
            src/baseline-evidence/vendor-lock.json
            src/baseline-evidence/ecc-install-preview.json
          if-no-files-found: error
