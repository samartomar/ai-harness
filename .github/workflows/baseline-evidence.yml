name: baseline-evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh:
        description: Run the detached Scanner baseline refresh and produce a Core evidence candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SCANNER_VERSION: 0.2.0

jobs:
  # Keep this required-check name stable. Normal Core CI verifies only the
  # committed evidence contract; analyzer execution belongs to Scanner and is
  # intentionally available through the explicit refresh path below.
  vet-once:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ai-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify the committed baseline evidence contract
        run: npm run baseline:check
      - name: Upload committed baseline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-evidence-lock
          path: |
            src/baseline-evidence/vendor-lock.json
            src/baseline-evidence/ecc-install-preview.json
          if-no-files-found: error

  # The two exact source scans run independently and in parallel. Core authors
  # each canonical request, then the public Scanner package owns every analyzer
  # process and emits an unsigned, authority-free observation bundle.
  refresh-execute:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ecc
            repository: samartomar/ECC
            sha: 5caf398a91599029a176ca6d806409b00d1052c4
          - id: superpowers
            repository: obra/Superpowers
            sha: 3dcbd5c4b48e02263fbf4a3c01e3fe4f81d584d9
    steps:
      - name: Check out ai-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: .baseline-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Set up fixed Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up fixed uv runtime
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: npm ci
      - name: Bind Scanner's fixed analyzer runtime paths
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          python_prefix="$(python3.13 -c 'import sys; print(sys.prefix)')"
          sudo cp -a "${python_prefix}/." /usr/local/
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          sudo ln -sf /usr/local/bin/python3.13 /usr/bin/python3.13
          test "$(id -u)" -ne 0
          test -x /usr/bin/docker
          test -x /usr/bin/bwrap
          test -x /usr/local/bin/uv
          test -x /usr/bin/python3.13
          /usr/bin/python3.13 -c 'import sys; assert sys.version_info[:2] == (3, 13)'
      - name: Author the exact Core request
        shell: bash
        run: |
          set -euo pipefail
          mkdir scanner-refresh
          npm run baseline:request -- \
            --catalog "${{ matrix.id }}" \
            --source .baseline-source \
            --output "scanner-refresh/${{ matrix.id }}.request.json"
      - name: Execute the public Scanner baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run baseline:vet -- \
            --request "scanner-refresh/${{ matrix.id }}.request.json" \
            --source .baseline-source \
            --output "scanner-refresh/${{ matrix.id }}.bundle"
      - name: Upload unsigned Scanner observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-baseline-unsigned-${{ matrix.id }}
          path: scanner-refresh
          if-no-files-found: error

  # Signing is deliberately detached from analyzer execution. The short-lived
  # test key proves custody/integrity for this refresh but confers no product
  # approval, organization authority, or provenance.
  refresh-sign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
    needs: refresh-execute
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned Scanner observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scanner-baseline-unsigned-*
          path: scanner-refresh
          merge-multiple: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the exact public Scanner package in isolation
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .signer --ignore-scripts --no-audit --no-fund --save-exact "@aihq/scan@${SCANNER_VERSION}"
          installed="$(node -p "require('./.signer/node_modules/@aihq/scan/package.json').version")"
          test "$installed" = "$SCANNER_VERSION"
      - name: Sign both exact Scanner bundles with ephemeral custody
        shell: bash
        run: |
          set -euo pipefail
          scanner=".signer/node_modules/@aihq/scan/dist/cli.js"
          openssl genpkey -algorithm ED25519 -out .signer/private.pem
          openssl pkey -in .signer/private.pem -pubout -outform DER -out .signer/public.der
          key_id="ed25519:$(sha256sum .signer/public.der | cut -d ' ' -f 1)"
          public_key="$(base64 -w 0 .signer/public.der)"
          signed_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          expires_at="$(date -u -d '+45 minutes' +'%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n --arg key "$key_id" \
            '{identity:"github-actions:baseline-evidence",class:"test-ephemeral",keyId:$key}' \
            > scanner-refresh/signer.json
          jq -n --arg signed "$signed_at" --arg expires "$expires_at" \
            '{signedAt:$signed,expiresAt:$expires}' > scanner-refresh/claims.json
          jq -n --arg key "$key_id" --arg public "$public_key" \
            '{roots:[{identity:"github-actions:baseline-evidence",class:"test-ephemeral",keyId:$key,publicKeySpkiBase64:$public}]}' \
            > scanner-refresh/roots.json
          jq -n --arg now "$signed_at" --arg key "$key_id" \
            '{now:$now,signer:{identity:"github-actions:baseline-evidence",class:"test-ephemeral",keyId:$key}}' \
            > scanner-refresh/expected.json
          for source in ecc superpowers; do
            node "$scanner" baseline-sign \
              --request "scanner-refresh/${source}.request.json" \
              --bundle "scanner-refresh/${source}.bundle" \
              --signer scanner-refresh/signer.json \
              --private-key .signer/private.pem \
              --claims scanner-refresh/claims.json \
              --output "scanner-refresh/${source}.evidence.json"
          done
          shred -u .signer/private.pem || rm -f .signer/private.pem
          rm -f .signer/public.der
      - name: Upload signed Scanner custody
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-baseline-signed
          path: scanner-refresh
          if-no-files-found: error

  # Core verifies the request, source, annex digests, signature, freshness,
  # replay state, and fixed analyzer identities before it interprets detached
  # SARIF. Its runner throws if any analyzer command is attempted.
  refresh-consume:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
    needs: refresh-sign
    runs-on: ubuntu-latest
    steps:
      - name: Check out ai-harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out exact ECC baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samartomar/ECC
          ref: 5caf398a91599029a176ca6d806409b00d1052c4
          path: .baseline-sources/ecc
          persist-credentials: false
      - name: Check out exact Superpowers baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: obra/Superpowers
          ref: 3dcbd5c4b48e02263fbf4a3c01e3fe4f81d584d9
          path: .baseline-sources/superpowers
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Download signed Scanner custody
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanner-baseline-signed
          path: scanner-refresh
      - name: Verify and consume detached Scanner evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          for source in ecc superpowers; do
            npm run baseline:consume -- \
              --catalog "$source" \
              --source ".baseline-sources/${source}" \
              --request "scanner-refresh/${source}.request.json" \
              --bundle "scanner-refresh/${source}.bundle" \
              --evidence "scanner-refresh/${source}.evidence.json" \
              --roots scanner-refresh/roots.json \
              --expected scanner-refresh/expected.json \
              --output "candidate/${source}.json"
          done
          npm run baseline:assemble -- \
            --ecc-root .baseline-sources/ecc \
            --ecc-evidence candidate/ecc.json \
            --superpowers-evidence candidate/superpowers.json \
            --out candidate/vendor-lock.json \
            --preview-out candidate/ecc-install-preview.json
      - name: Verify the generated Core candidate
        shell: bash
        run: |
          set -euo pipefail
          cp candidate/vendor-lock.json src/baseline-evidence/vendor-lock.json
          cp candidate/ecc-install-preview.json src/baseline-evidence/ecc-install-preview.json
          npm run baseline:check
          npx vitest run \
            tests/baseline-evidence/scanner-consumer.test.ts \
            tests/baseline-evidence/analyzer-profile.test.ts \
            tests/baseline-evidence/analyzer-gate.test.ts \
            tests/baseline-evidence/package.test.ts
      - name: Upload generated Core baseline candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-baseline-core-candidate
          path: |
            candidate/vendor-lock.json
            candidate/ecc-install-preview.json
          if-no-files-found: error
