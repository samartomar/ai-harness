name: nightly-safety

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: full integration (${{ matrix.os }}, node-${{ matrix.node }})
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22", coverage: true }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Complete test and coverage evidence
        if: matrix.coverage == true
        run: npm run test:cov -- --maxWorkers=2 --testTimeout=15000
      - name: Complete cross-platform test evidence
        if: matrix.coverage != true
        run: npm test -- --testTimeout=15000
      - name: Build and cold packed lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:release-candidate

  evidence:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Create evidence directory
        run: mkdir -p nightly-safety-evidence
      - name: AI runtime inventory
        run: npm run check:ai-runtime -- --json > nightly-safety-evidence/ai-runtime-inventory.json
      - name: BUGBOUNTY report summary
        run: npm run check:bugbounty-report -- --json > nightly-safety-evidence/bugbounty-report.json
      - name: Docs lint
        run: npm run docs:lint
      - name: Tracked artifact guard
        run: npm run check:artifacts
      - name: Upload nightly evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-safety-${{ github.run_id }}
          path: nightly-safety-evidence/
          if-no-files-found: error
          retention-days: 5
