# Candidate qualification and npm publication are separate effects. A protected,
# annotated v-core-* tag can only build, test, and seal a candidate. Publication
# requires a later workflow_dispatch carrying the qualification run identity and
# an exact artifact-bound owner authorization comment from the release tracker.
#
# Required npm Trusted Publisher tuple: samartomar/ai-harness, release.yml,
# environment npm-publish, allowed action npm publish.
name: release

on:
  push:
    tags: ["v-core-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Qualified annotated v-core-* tag
        required: true
        type: string
      qualification_run_id:
        description: Successful tag qualification workflow run ID
        required: true
        type: string
      qualification_run_attempt:
        description: Qualification workflow run attempt
        required: true
        default: "1"
        type: string
      publication_authorization_comment:
        description: Exact artifact-bound authorization comment URL on the release tracker
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-pack:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      tag_object: ${{ steps.freeze.outputs.tag_object }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert annotated tag is a protected-main candidate
        id: freeze
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"
          tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME")"
          tag_sha="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          test "$tag_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_sha" refs/remotes/origin/main
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
      - name: Require successful exact protected-main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" -f per_page=100 > check-runs.json
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=100 > ci-runs.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const required = ["analyze", "verify (ubuntu-latest)", "verify (macos-latest)", "verify (windows-latest)"];
          const checks = JSON.parse(readFileSync("check-runs.json", "utf8"));
          if (!Array.isArray(checks?.check_runs)) throw new Error("malformed check-run receipt");
          const accepted = required.map((name) => {
            const match = checks.check_runs.find((check) =>
              check?.name === name && check?.status === "completed" &&
              check?.conclusion === "success" && check?.head_sha === process.env.GITHUB_SHA);
            if (!match) throw new Error(`missing successful exact-SHA check: ${name}`);
            return { name, conclusion: "success" };
          });
          const runs = JSON.parse(readFileSync("ci-runs.json", "utf8"));
          const exact = (runs?.workflow_runs ?? []).filter((run) =>
            run?.head_sha === process.env.GITHUB_SHA && run?.head_branch === "main" &&
            run?.event === "push" && run?.status === "completed" && run?.conclusion === "success");
          exact.sort((left, right) => (left.run_number ?? 0) - (right.run_number ?? 0));
          const selected = exact.at(-1);
          if (!Number.isSafeInteger(selected?.id) || selected.id <= 0) throw new Error("no successful exact-SHA main CI receipt");
          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${selected.id}`;
          if (selected.html_url !== runUrl) throw new Error("invalid protected-main CI URL");
          writeFileSync("protected-main-ci.json", `${JSON.stringify({ runId: selected.id, runUrl, requiredChecks: accepted }, null, 2)}\n`, { flag: "wx" });
          NODE
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Validate enterprise adoption decision unit
        run: npm run release:governance -- manifest release/enterprise-change.json "$GITHUB_REPOSITORY"
      - name: Assert package and manifest identity match the tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v-core-$version"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("release/enterprise-change.json", "utf8"));
          if (manifest.package.name !== "@aihq/core" || manifest.package.version !== process.env.GITHUB_REF_NAME.slice(7)) throw new Error("candidate package mismatch");
          NODE
      - name: Verify package-specific release candidate
        run: npm run verify:release-candidate
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Pack exact release tarball and checksum
        id: pack
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > npm-pack.json
          tarball="$(node -e 'const fs=require("node:fs");const v=JSON.parse(fs.readFileSync("npm-pack.json","utf8"));if(v.length!==1||typeof v[0]?.filename!=="string")process.exit(1);process.stdout.write(v[0].filename)')"
          version="$(node -p "require('./package.json').version")"
          test "$tarball" = "aihq-core-$version.tgz"
          tarball_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          [[ "$tarball_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$tarball_sha256" "$tarball" > SHA256SUMS.txt
          printf 'tarball=%s\ntarball_sha256=%s\n' "$tarball" "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload digest-bound candidate packet
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            SHA256SUMS.txt
            protected-main-ci.json
            release/enterprise-change.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  candidate-installed:
    if: github.event_name == 'push'
    needs: verify-and-pack
    name: candidate installed (${{ matrix.os }}, node-${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "20" }
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the exact candidate packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-and-pack.outputs.artifact_id }}
          path: candidate
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install and execute only the exact packed artifact
        shell: bash
        env:
          TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.verify-and-pack.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "candidate/$TARBALL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/candidate/$TARBALL"
          "$consumer/node_modules/.bin/aih" --version
          "$consumer/node_modules/.bin/aih" --help > /dev/null
          node --input-type=module - "$consumer" <<'NODE'
          import { pathToFileURL } from "node:url";
          import { resolve } from "node:path";
          const module = await import(pathToFileURL(resolve(process.argv[2], "node_modules/@aihq/core/dist/index.js")));
          if (typeof module.runSessionGuardrails !== "function") throw new Error("missing library export");
          NODE

  seal-qualification:
    if: github.event_name == 'push'
    needs: [verify-and-pack, candidate-installed]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      evidence_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact candidate packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-and-pack.outputs.artifact_id }}
          path: candidate
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate tarball-scoped SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: aih-sbom.spdx.json
          file: candidate/${{ needs.verify-and-pack.outputs.tarball }}
          format: spdx-json
          output-file: aih-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build and validate qualification receipt
        env:
          ARTIFACT_DIGEST: ${{ needs.verify-and-pack.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.verify-and-pack.outputs.artifact_id }}
          TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.verify-and-pack.outputs.tarball_sha256 }}
          TAG_OBJECT: ${{ needs.verify-and-pack.outputs.tag_object }}
        run: |
          set -euo pipefail
          enterprise_sha="$(sha256sum candidate/enterprise-change.json | awk '{print $1}')"
          sbom_sha="$(sha256sum aih-sbom.spdx.json | awk '{print $1}')"
          node --input-type=module - "$enterprise_sha" "$sbom_sha" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [enterpriseChangeSha256, sbomSha256] = process.argv.slice(2);
          const candidate = JSON.parse(readFileSync("candidate/enterprise-change.json", "utf8"));
          const protectedMainCi = JSON.parse(readFileSync("candidate/protected-main-ci.json", "utf8"));
          const rawDigest = process.env.ARTIFACT_DIGEST ?? "";
          const receipt = {
            schemaVersion: "aih-release-qualification-v1",
            package: { name: "@aihq/core", version: candidate.package.version },
            source: { sha: process.env.GITHUB_SHA, tag: process.env.GITHUB_REF_NAME, tagObject: process.env.TAG_OBJECT },
            tracker: candidate.tracker,
            protectedMainCi,
            artifact: {
              id: Number(process.env.ARTIFACT_ID),
              digest: rawDigest.startsWith("sha256:") ? rawDigest : `sha256:${rawDigest}`,
              tarball: process.env.TARBALL,
              tarballSha256: process.env.TARBALL_SHA256,
            },
            manifests: { enterpriseChangeSha256, sbomSha256 },
            workflow: { path: ".github/workflows/release.yml", revision: process.env.GITHUB_SHA, runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) },
            matrix: [
              { os: "ubuntu-latest", node: "22", scope: "full-source", conclusion: "success" },
              { os: "macos-latest", node: "22", scope: "full-source", conclusion: "success" },
              { os: "windows-latest", node: "22", scope: "full-source", conclusion: "success" },
              { os: "ubuntu-latest", node: "20", scope: "installed-artifact", conclusion: "success" },
              { os: "ubuntu-latest", node: "22", scope: "installed-artifact", conclusion: "success" },
              { os: "ubuntu-latest", node: "24", scope: "installed-artifact", conclusion: "success" },
              { os: "macos-latest", node: "22", scope: "installed-artifact", conclusion: "success" },
              { os: "windows-latest", node: "22", scope: "installed-artifact", conclusion: "success" },
            ],
            createdAt: new Date().toISOString().replace(/\.\d{3}Z$/u, "Z"),
          };
          writeFileSync("qualification.json", `${JSON.stringify(receipt, null, 2)}\n`, { flag: "wx" });
          NODE
          npm run release:governance -- qualification qualification.json "$GITHUB_REPOSITORY"
          token="$(npm run --silent release:governance -- publication-token qualification.json)"
          printf '### Candidate qualified; no npm publication occurred\n\n`%s`\n' "$token" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durable qualification evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification.json
            aih-sbom.spdx.json
            candidate/enterprise-change.json
            candidate/protected-main-ci.json
            candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  authorize-publication:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      candidate_artifact_id: ${{ steps.identity.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.identity.outputs.candidate_artifact_digest }}
      tarball: ${{ steps.identity.outputs.tarball }}
      tarball_sha256: ${{ steps.identity.outputs.tarball_sha256 }}
      tracker_issue: ${{ steps.identity.outputs.tracker_issue }}
      rejected_token: ${{ steps.identity.outputs.rejected_token }}
      superseded_token: ${{ steps.identity.outputs.superseded_token }}
      packet_artifact_id: ${{ steps.packet.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-release-evidence-${{ inputs.qualification_run_id }}-${{ inputs.qualification_run_attempt }}
          path: authorized
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - name: Resolve exact artifact-bound owner authorization
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_COMMENT: ${{ inputs.publication_authorization_comment }}
          EXPECTED_RUN_ID: ${{ inputs.qualification_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          npm run release:governance -- qualification authorized/qualification.json "$GITHUB_REPOSITORY"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("authorized/qualification.json", "utf8"));
          if (r.workflow.runId !== Number(process.env.EXPECTED_RUN_ID) || r.workflow.runAttempt !== Number(process.env.EXPECTED_RUN_ATTEMPT) || r.source.tag !== process.env.EXPECTED_TAG) throw new Error("qualification dispatch identity mismatch");
          if (process.env.GITHUB_REF_TYPE !== "tag" || process.env.GITHUB_REF_NAME !== r.source.tag || process.env.GITHUB_SHA !== r.workflow.revision) throw new Error("publication must dispatch the workflow from the qualified tag revision");
          NODE
          npm run release:governance -- resolve-publication authorized/qualification.json "$GITHUB_REPOSITORY" "$AUTHORIZATION_COMMENT" authorization.json
          npm run release:governance -- assert-active authorized/qualification.json "$GITHUB_REPOSITORY"
      - name: Reobserve qualification run, tag, and protected-main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .event)" = "push"
          source_sha="$(node -p "require('./authorized/qualification.json').source.sha")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$source_sha"
          observation="$(mktemp -d)"
          git -C "$observation" init --bare
          git -C "$observation" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$observation" fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git -C "$observation" cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git -C "$observation" rev-parse "refs/tags/$TAG^{}")" = "$source_sha"
          git -C "$observation" merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
      - name: Export immutable publication identity
        id: identity
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const r = JSON.parse(readFileSync("authorized/qualification.json", "utf8"));
          const c = (v) => v === null || typeof v !== "object" ? JSON.stringify(v) : Array.isArray(v) ? `[${v.map(c).join(",")}]` : `{${Object.keys(v).sort().map((k) => `${JSON.stringify(k)}:${c(v[k])}`).join(",")}}`;
          const q = createHash("sha256").update(c(r)).digest("hex");
          const state = { rejected: `AIH-CANDIDATE-STATE-V1 sha256:${q} rejected`, superseded: `AIH-CANDIDATE-STATE-V1 sha256:${q} superseded` };
          writeFileSync("candidate-state-tokens.json", `${JSON.stringify(state, null, 2)}\n`, { flag: "wx" });
          appendFileSync(process.env.GITHUB_OUTPUT, [`candidate_artifact_id=${r.artifact.id}`, `candidate_artifact_digest=${r.artifact.digest}`, `tarball=${r.artifact.tarball}`, `tarball_sha256=${r.artifact.tarballSha256}`, `tracker_issue=${r.tracker.issueNumber}`, `rejected_token=${state.rejected}`, `superseded_token=${state.superseded}`, ""].join("\n"));
          NODE
      - name: Upload authorized publication packet
        id: packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authorized-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            authorized/
            authorization.json
            candidate-state-tokens.json
          if-no-files-found: error
          retention-days: 90

  seal-publication-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: authorize-publication
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      sealed_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sealed_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Download authorized packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.authorize-publication.outputs.packet_artifact_id }}
          path: sealed
          digest-mismatch: error
      - name: Download exact qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.authorize-publication.outputs.candidate_artifact_id }}
          path: sealed/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
          digest-mismatch: error
      - name: Verify exact tarball before attestation
        env:
          TARBALL: ${{ needs.authorize-publication.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.authorize-publication.outputs.tarball_sha256 }}
        run: test "$(sha256sum "sealed/candidate/$TARBALL" | awk '{print $1}')" = "$EXPECTED_SHA256"
      - name: Attest build provenance for the exact tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sealed/candidate/${{ needs.authorize-publication.outputs.tarball }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum and retain provenance bundle
        working-directory: sealed
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json candidate/SHA256SUMS.txt
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - name: Upload recovery evidence before npm effect
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  npm-publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [authorize-publication, seal-publication-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aihq/core
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
    steps:
      - name: Download sealed authorized bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.seal-publication-evidence.outputs.sealed_artifact_id }}
          path: sealed
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Revalidate custody, candidate state, tag, and ancestry immediately before effect
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.authorize-publication.outputs.candidate_artifact_digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.authorize-publication.outputs.candidate_artifact_id }}
          EXPECTED_SHA256: ${{ needs.authorize-publication.outputs.tarball_sha256 }}
          REJECTED_TOKEN: ${{ needs.authorize-publication.outputs.rejected_token }}
          SUPERSEDED_TOKEN: ${{ needs.authorize-publication.outputs.superseded_token }}
          TAG: ${{ inputs.tag }}
          TARBALL: ${{ needs.authorize-publication.outputs.tarball }}
          TRACKER_ISSUE: ${{ needs.authorize-publication.outputs.tracker_issue }}
        run: |
          set -euo pipefail
          test "$(sha256sum "sealed/candidate/$TARBALL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_ARTIFACT_DIGEST"
          authorization_comment_id="$(node -p "require('./sealed/authorization.json').commentId")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$authorization_comment_id" > live-authorization.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$TRACKER_ISSUE/comments?per_page=100" > comments-pages.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const authorization = JSON.parse(readFileSync("sealed/authorization.json", "utf8"));
          const liveAuthorization = JSON.parse(readFileSync("live-authorization.json", "utf8"));
          if (liveAuthorization?.id !== authorization.commentId || liveAuthorization?.html_url !== authorization.commentUrl || liveAuthorization?.author_association !== "OWNER" || liveAuthorization?.created_at !== authorization.createdAt) throw new Error("publication authorization identity changed before effect");
          if (typeof liveAuthorization?.body !== "string" || !liveAuthorization.body.split(/\r?\n/u).some((line) => line.trim() === authorization.token)) throw new Error("publication authorization token changed before effect");
          const pages = JSON.parse(readFileSync("comments-pages.json", "utf8"));
          if (!Array.isArray(pages) || pages.some((page) => !Array.isArray(page))) throw new Error("candidate state response is invalid");
          const comments = pages.flat();
          for (const comment of comments) {
            if (comment?.author_association !== "OWNER" || typeof comment?.body !== "string") continue;
            const lines = new Set(comment.body.split(/\r?\n/u).map((line) => line.trim()));
            if (lines.has(process.env.REJECTED_TOKEN)) throw new Error("candidate was rejected");
            if (lines.has(process.env.SUPERSEDED_TOKEN)) throw new Error("candidate was superseded");
          }
          NODE
          observation="$(mktemp -d)"
          git -C "$observation" init --bare
          git -C "$observation" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$observation" fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TAG:refs/tags/$TAG"
          source_sha="$(node -p "require('./sealed/authorized/qualification.json').source.sha")"
          tag_object="$(node -p "require('./sealed/authorized/qualification.json').source.tagObject")"
          test "$(git -C "$observation" cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git -C "$observation" rev-parse "refs/tags/$TAG")" = "$tag_object"
          test "$(git -C "$observation" rev-parse "refs/tags/$TAG^{}")" = "$source_sha"
          git -C "$observation" merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
      - name: Validate packed manifest identity
        env:
          TARBALL: ${{ needs.authorize-publication.outputs.tarball }}
          TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const version = process.env.TAG.slice("v-core-".length);
          const manifest = JSON.parse(execFileSync("tar", ["-xOf", `sealed/candidate/${process.env.TARBALL}`, "package/package.json"], { encoding: "utf8" }));
          if (manifest.name !== "@aihq/core" || manifest.version !== version) throw new Error("packed identity mismatch");
          if (JSON.stringify(manifest.publishConfig) !== JSON.stringify({ access: "public" })) throw new Error("unsafe publishConfig");
          NODE
      - name: Publish exact tarball through npm Trusted Publishing
        env:
          TARBALL: ${{ needs.authorize-publication.outputs.tarball }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::token credentials are forbidden; npm publish must use OIDC"
            exit 1
          fi
          npm_version="$(npm --version)"
          node --input-type=module - "$npm_version" <<'NODE'
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(process.argv[2] ?? "");
          if (!match) process.exit(1);
          const actual = match.slice(1).map(Number), minimum = [11, 5, 1];
          for (let i = 0; i < minimum.length; i += 1) {
            if (!Number.isSafeInteger(actual[i])) process.exit(1);
            if (actual[i] > minimum[i]) process.exit(0);
            if (actual[i] < minimum[i]) process.exit(1);
          }
          NODE
          dist_tag=next
          tarball="sealed/candidate/$TARBALL"
          npm publish "$tarball" --ignore-scripts --provenance --access public --registry "https://registry.npmjs.org/" --tag "$dist_tag"

  github-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [authorize-publication, seal-publication-evidence, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the same sealed evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.seal-publication-evidence.outputs.sealed_artifact_id }}
          path: sealed
          digest-mismatch: error
      - name: Create prerelease mirror from sealed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARBALL: ${{ needs.authorize-publication.outputs.tarball }}
        run: |
          set -euo pipefail
          notes="Curated release notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --prerelease --generate-notes --notes "$notes" \
            "sealed/candidate/$TARBALL" sealed/candidate/SHA256SUMS.txt \
            sealed/SHA256SUMS.txt.sigstore.json sealed/provenance.intoto.jsonl \
            sealed/authorized/aih-sbom.spdx.json sealed/authorized/enterprise-change.json \
            sealed/authorized/qualification.json sealed/authorization.json
