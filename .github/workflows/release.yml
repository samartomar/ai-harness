# Cut a GitHub Release when a v-core-* tag is pushed. Verifies the gates (typecheck,
# lint, test+coverage, build), then PACKS a verifiable install artifact (tarball +
# SHA256 checksum + SPDX SBOM), generates a GitHub build-provenance attestation
# (keyless, via OIDC), smoke-installs it, publishes the same tarball to npm through
# Trusted Publishing with provenance, and attaches everything to the Release.
#
# Required @aihq/core Trusted Publisher config (npmjs.com): repository
# samartomar/ai-harness, workflow .github/workflows/release.yml, environment
# npm-publish. RELEASING.md keeps the package bootstrap as an owner-only gate.
name: release

on:
  push:
    tags:
      - "v-core-*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@aihq/core
    permissions:
      contents: write # create the GitHub Release for the tag
      id-token: write # keyless signing identity for the provenance attestation
      attestations: write # record the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert tag commit is current main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::tag commit $GITHUB_SHA does not match origin/main ($main_sha)"
            exit 1
          fi
          echo "tag commit $GITHUB_SHA matches origin/main"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - name: Assert package version matches the tag
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v-core-}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::package.json version ($ver) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version $ver matches tag $GITHUB_REF_NAME"
      - name: Verify
        run: npm run verify
      - name: Check required baseline analyzer receipts
        run: npm run check:baseline-analyzers
      - name: Check installable baseline
        run: npm run check:baseline-installable
      - name: Pack tarball + SHA256 checksum
        run: |
          set -euo pipefail
          npm pack
          sha256sum ./*.tgz | tee SHA256SUMS.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: aih-sbom.spdx.json
          format: spdx-json
          output-file: aih-sbom.spdx.json
      - name: Attest build provenance for the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "./*.tgz"
      # Attach VERIFIABLE signature files to the Release itself (not only the
      # attestation store): a keyless cosign SIGNATURE BUNDLE over SHA256SUMS.txt
      # (cosign v3 new-bundle-format — one .sigstore.json carrying signature +
      # certificate; the v2 --output-signature/--output-certificate flags are
      # deprecated no-ops there and broke the v0.6.0 run) plus the build-provenance
      # bundle. Consumers verify with
      #   cosign verify-blob --bundle SHA256SUMS.txt.sigstore.json \
      #     --certificate-identity-regexp 'github.com/samartomar/ai-harness' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS.txt
      # (also what OpenSSF Scorecard's Signed-Releases check looks for).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless, GitHub OIDC)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - name: Smoke-install the packed tarball
        run: |
          set -euo pipefail
          tarball="$(ls "$GITHUB_WORKSPACE"/*.tgz)"
          work="$(mktemp -d)"; cd "$work"; npm init -y >/dev/null
          npm install "$tarball"
          npx aih --version
          npx aih --help | head -n 3
      - name: Publish to npm with trusted publishing
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          case "$ver" in
            *-*) tag=next ;;   # prerelease (e.g. 0.3.0-rc.1) → next, never latest
            *)   tag=latest ;;
          esac
          echo "publishing $ver to dist-tag $tag"
          npm publish ./*.tgz --provenance --access public --tag "$tag"
      - name: Create GitHub Release (with verifiable artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lead with the curated changelog, then let GitHub append its PR list. The
          # link is pinned to this tag so it can never drift or 404 (#563).
          notes="Curated release notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes" \
            ./*.tgz SHA256SUMS.txt SHA256SUMS.txt.sigstore.json \
            provenance.intoto.jsonl aih-sbom.spdx.json
