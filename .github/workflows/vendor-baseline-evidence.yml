name: vendor-baseline-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind manual build to current protected main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build deterministic vendor baseline-evidence subject
        run: >-
          npm run baseline:artifact -- --out .baseline-evidence-artifact
          --repository "$GITHUB_REPOSITORY" --environment baseline-evidence-publish
      - name: Transfer complete vendor baseline-evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: vendor-baseline-evidence-v1
          path: .baseline-evidence-artifact
          if-no-files-found: error
          include-hidden-files: true
  attest:
    needs: build
    runs-on: ubuntu-latest
    environment: baseline-evidence-publish
    permissions:
      attestations: write
      id-token: write
    steps:
      - name: Download same-run vendor baseline-evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor-baseline-evidence-v1
          path: .baseline-evidence-artifact
      - name: Require downloaded checksum subject
        run: test -f .baseline-evidence-artifact/SHA256SUMS
      - name: Attest vendor baseline-evidence checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .baseline-evidence-artifact/SHA256SUMS
