name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Cross-platform matrix: the harness ships per-OS adapters (certs, hardware,
    # vdi, profile) whose behavior must not regress on Windows/macOS unnoticed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tracked artifact guard
        run: npm run check:artifacts
      - name: ECC installer package check
        run: npm run check:ecc-installer
      # Read-only drift gate (no --apply): the committed ai-coding/ canon and the
      # generated blocks in CLAUDE.md / AGENTS.md / RULE_ROUTER.md must match their
      # generator. Ubuntu only: the comparison is OS-independent text, and the
      # Windows runners' autocrlf=true checkout would false-fail it. The router
      # heading embeds the checkout directory's basename — the default Actions path
      # ends in .../ai-harness, which matches; a renamed checkout (or a local
      # worktree) reports a false RULE_ROUTER.md drift.
      - name: Canon drift gate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:canon-drift
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint & format check
        if: matrix.os == 'ubuntu-latest' # biome is OS-independent — run once
        run: npx biome ci src tests
      # Enforce the coverage thresholds on one OS (deterministic line/branch hits);
      # the other OSes run the suite to validate cross-platform behavior.
      - name: Test + coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage
      # Tokenless upload works for public repos; installing the Codecov GitHub
      # App (or a CODECOV_TOKEN secret) upgrades reliability. Never fails CI —
      # the coverage GATE is the vitest thresholds above, not the upload.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: npx vitest run
      - name: Build
        run: npx tsup
      - name: Check installable baseline
        run: npm run check:baseline-installable
