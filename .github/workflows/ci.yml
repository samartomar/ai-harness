name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Ubuntu owns coverage and OS-independent gates; macOS keeps its complete
    # platform suite in four sequential processes so DOM-heavy Workbench files
    # release their heap between shards. Windows is sharded below without
    # dropping any test files.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The complete Workbench catalog is intentionally exercised on both
    # platforms. Keep enough V8 heap for the 411-subject DOM/model suite.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tracked artifact guard
        run: npm run check:artifacts
      - name: ECC installer package check
        run: npm run check:ecc-installer
      # Self-hosting boundary: compare the manually maintained shared block,
      # bootloaders, contract mirror, live tracked-file count, package scripts, and
      # CI wiring without invoking the AIH CLI against its own checkout.
      - name: Self-hosting canon gate
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:self-hosting-canon
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint & format check
        if: matrix.os == 'ubuntu-latest' # biome is OS-independent — run once
        run: npx biome ci src tests
      # Enforce the coverage thresholds on one OS (deterministic line/branch hits);
      # the other OSes run the suite to validate cross-platform behavior.
      - name: Test + coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage
      # Tokenless upload works for public repos; installing the Codecov GitHub
      # App (or a CODECOV_TOKEN secret) upgrades reliability. Never fails CI —
      # the coverage GATE is the vitest thresholds above, not the upload.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Test macOS shard 1/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=1/4
      - name: Test macOS shard 2/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=2/4
      - name: Test macOS shard 3/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=3/4
      - name: Test macOS shard 4/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=4/4
      - name: Build
        run: npx tsup
      - name: Check installable baseline
        run: npm run check:baseline-installable

  windows_tests:
    name: windows test (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Run the non-test Windows checks once. Both shards still execute their
      # deterministic half of the complete Vitest file set.
      - name: Tracked artifact guard
        if: matrix.shard == 1
        run: npm run check:artifacts
      - name: ECC installer package check
        if: matrix.shard == 1
        run: npm run check:ecc-installer
      - name: Typecheck
        if: matrix.shard == 1
        run: npx tsc --noEmit
      - name: Test Windows shard
        # Hosted Windows load can push filesystem-heavy cases past Vitest's
        # 5-second default without changing their assertions or file coverage.
        run: npx vitest run --testTimeout=15000 --shard=${{ matrix.shard }}/2
      - name: Build
        if: matrix.shard == 1
        run: npx tsup
      - name: Check installable baseline
        if: matrix.shard == 1
        run: npm run check:baseline-installable

  # Branch protection requires this exact context. It is deliberately a
  # fail-closed fan-in: a failed, cancelled, skipped, or missing matrix result
  # cannot be converted into a green Windows verification result.
  windows_verify:
    name: verify (windows-latest)
    if: ${{ always() }}
    needs: windows_tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard
        env:
          WINDOWS_SHARDS_RESULT: ${{ needs.windows_tests.result }}
        run: |
          if [ "$WINDOWS_SHARDS_RESULT" != "success" ]; then
            echo "Windows shards did not all succeed: $WINDOWS_SHARDS_RESULT" >&2
            exit 1
          fi
