name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full_suite: ${{ steps.impact.outputs.full_suite }}
      risk_class: ${{ steps.impact.outputs.risk_class }}
      test_lane: ${{ steps.impact.outputs.test_lane }}
      selected_tests_json: ${{ steps.impact.outputs.selected_tests_json }}
      operating_systems_json: ${{ steps.impact.outputs.operating_systems_json }}
      release_preparation: ${{ steps.impact.outputs.release_preparation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Classify changed paths and emit impact receipt
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run ci:classify -- --base "$BASE_SHA" --head "$HEAD_SHA" --output ci-impact.json
      - name: Upload CI impact receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-impact.json
          if-no-files-found: error
          retention-days: 30

  selected_tests:
    name: selected tests (${{ matrix.os }})
    if: ${{ needs.classify.outputs.full_suite != 'true' }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.operating_systems_json) }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      SELECTED_TESTS_JSON: ${{ needs.classify.outputs.selected_tests_json }}
      FULL_SUITE: ${{ needs.classify.outputs.full_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run the authoritative selected suite
        run: npm run --silent ci:run-selected

  quality:
    name: static quality and build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tracked artifact guard
        run: npm run check:artifacts
      - name: ECC installer package check
        run: npm run check:ecc-installer
      - name: Self-hosting canon gate
        run: npm run check:self-hosting-canon
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint and format check
        run: npx biome ci src tests
      - name: Documentation lint
        run: npm run docs:lint
      - name: Packed documentation links
        run: npm run check:packed-doc-links
      - name: Build
        run: npx tsup
      - name: Check installable baseline
        run: npm run check:baseline-installable

  release_prep_guard:
    name: release preparation allowlist
    if: github.event_name == 'pull_request'
    needs: classify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip ordinary pull requests
        if: ${{ needs.classify.outputs.release_preparation != 'true' && !startsWith(github.head_ref, 'release/v-core-') }}
        run: echo "Not a Core release-preparation PR."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.classify.outputs.release_preparation == 'true' || startsWith(github.head_ref, 'release/v-core-') }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.classify.outputs.release_preparation == 'true' || startsWith(github.head_ref, 'release/v-core-') }}
        with:
          node-version: "22"
          cache: npm
      - if: ${{ needs.classify.outputs.release_preparation == 'true' || startsWith(github.head_ref, 'release/v-core-') }}
        run: npm ci --ignore-scripts
      - name: Reject non-mechanical release preparation
        if: ${{ needs.classify.outputs.release_preparation == 'true' || startsWith(github.head_ref, 'release/v-core-') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" > label-pages.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pages = JSON.parse(readFileSync("label-pages.json", "utf8"));
          if (!Array.isArray(pages) || pages.some((page) => !Array.isArray(page))) throw new Error("label response is invalid");
          const semver = pages.flat()
            .map((label) => label?.name)
            .filter((name) => typeof name === "string" && name.startsWith("semver:"));
          if (semver.length !== 1 || semver[0] !== "semver:none") {
            throw new Error("Core release-preparation PR must carry exactly semver:none");
          }
          NODE
          npm run release:governance -- release-prep "$BASE_SHA" "$HEAD_SHA"

  full_verify:
    name: full test (${{ matrix.os }})
    if: ${{ needs.classify.outputs.full_suite == 'true' }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The complete Workbench catalog is intentionally exercised on both
    # platforms. Keep enough V8 heap for the 411-subject DOM/model suite.
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Enforce the coverage thresholds on one OS (deterministic line/branch hits);
      # the other OSes run the suite to validate cross-platform behavior. Keep
      # two workers here: coverage plus the complete Workbench catalog otherwise
      # starves unrelated filesystem and DOM tests past their own time budgets.
      - name: Test + coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage --maxWorkers=2 --testTimeout=15000
      # Tokenless upload works for public repos; installing the Codecov GitHub
      # App (or a CODECOV_TOKEN secret) upgrades reliability. Never fails CI —
      # the coverage GATE is the vitest thresholds above, not the upload.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Test macOS shard 1/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=1/4
      - name: Test macOS shard 2/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=2/4
      - name: Test macOS shard 3/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=3/4
      - name: Test macOS shard 4/4
        if: matrix.os == 'macos-latest'
        run: npx vitest run --shard=4/4

  windows_full_tests:
    name: windows test (${{ matrix.shard }}/2)
    if: ${{ needs.classify.outputs.full_suite == 'true' }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test Windows shard
        # Hosted Windows load can push filesystem-heavy cases past Vitest's
        # 5-second default without changing their assertions or file coverage.
        run: npx vitest run --testTimeout=15000 --shard=${{ matrix.shard }}/2

  # Branch protection keeps these exact context names. Every context fails
  # closed over the selected lane or the complete fallback matrix, so a failed,
  # cancelled, skipped, or missing dependency cannot be converted to green.
  required_verify:
    name: verify (${{ matrix.os }})
    if: ${{ always() }}
    needs:
      - classify
      - release_prep_guard
      - quality
      - selected_tests
      - full_verify
      - windows_full_tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the classified lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ needs.classify.outputs.full_suite }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_PREP_RESULT: ${{ needs.release_prep_guard.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SELECTED_RESULT: ${{ needs.selected_tests.result }}
          FULL_RESULT: ${{ needs.full_verify.result }}
          WINDOWS_RESULT: ${{ needs.windows_full_tests.result }}
        run: node .github/scripts/require-ci-lane.mjs

  pr_gate:
    name: pr-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [classify, release_prep_guard, required_verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require all authoritative jobs
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_PREP_RESULT: ${{ needs.release_prep_guard.result }}
          VERIFY_RESULT: ${{ needs.required_verify.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY_RESULT" "$RELEASE_PREP_RESULT" "$VERIFY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::required PR lane result is $result"
              exit 1
            fi
          done
