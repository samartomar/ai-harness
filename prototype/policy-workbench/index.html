<!doctype html>
<html lang="en">

<style>

  .pseg button.on { background: var(--color-surface-container-low); color: var(--color-on-surface); font-weight: 600; box-shadow: 0 0 0 1px var(--border-hairline); }
  .num { width: 18px; font: 600 12px ui-monospace, Consolas, monospace; opacity: .7; }
  main { padding: 20px 24px 32px; min-width: 0; }

  #frame { width: 1440px; height: 900px; border: 0; transform-origin: top left; display: block; }

</style>

<body>
<aside>

      "Rung 4, enterprise, when required: signing, and IT sets AIH_ORG_POLICY once per machine.",

  {
    "id": "scope",
    "nav": "First release: in and later",

    "items": [
      "In: both doors, polished together.",
      "In: admin page with the organization pre-filled, template defaults, sources, fact sheet, review backlog, and Publish writing one organization policy file.",

      "Later: several named policies cut from a master.",
      "Later: adding your own sources, with the scan commands.",
      "Later: a screen for setting up Enterprise signing.",
      "Later: named profiles and a switch command, for persona and agent setups that belong to no repo."
    ]
  },
  {
    "id": "decided",
    "nav": "Decisions so far",
    "title": "Decisions so far",
    "items": [

      "The admin may publish the template as it is on day one. Anything with a finding stays held back until reviewed.",

      "aih ships the catalog and scan results joined, plus templates, all as data.",
      "The admin starts from an aih template. The page renders that template's defaults and marks what the admin changed.",

      "Trust by mode: Vibe trusts the repo location, Enterprise also requires the organization's signature.",

      "Later: everything the admin adds shows as one source named after the organization.",
      "Later: the admin scans only their own additions: copy the command, load the result.",

      "First release: a team shares one setup by committing the policy file to the project repo. Named profiles and a switch command come later.",

const ALL = STEPS.concat(NOTES);
const $ = (id) => document.getElementById(id);
(function () { let g = ""; const nav = $("nav"); ALL.forEach((s) => { const grp = s.group || "Notes"; if (grp !== g) { g = grp; const d = document.createElement("div"); d.className = "grp"; d.textContent = g; nav.appendChild(d); } const a = document.createElement("a"); a.className = "step"; a.href = "#" + s.id; a.dataset.id = s.id; const n = document.createElement("span"); n.className = "num"; n.textContent = s.what ? String(STEPS.indexOf(s) + 1) : "·"; a.appendChild(n); a.appendChild(document.createTextNode(s.nav)); nav.appendChild(a); }); })();
const LOOK = { mode: document.documentElement.dataset.mode }; let shown = "";
function look(key, val) { LOOK[key] = val; document.documentElement.dataset.mode = val; document.documentElement.classList.toggle("dark", val === "dark"); document.documentElement.classList.toggle("light", val !== "dark"); try { localStorage.setItem("wb-" + key, val); } catch (e) {} paint(); show(); }
function paint() { for (const [id, key] of [["modeSeg", "mode"]]) document.querySelectorAll("#" + id + " button").forEach((b) => { b.classList.toggle("on", b.dataset.v === LOOK[key]); b.onclick = () => look(key, b.dataset.v); }); }
function fit() { const s = Math.min(1, $("stage").clientWidth / 1440); $("frame").style.transform = "scale(" + s + ")"; $("stage").style.height = Math.round(900 * s) + "px"; }
function show() {
  const id = (location.hash || "#" + ALL[0].id).slice(1);

  const s = ALL[i], isNote = !s.what;
  document.querySelectorAll(".step").forEach((a) => a.classList.toggle("on", a.dataset.id === s.id));
  $("title").textContent = s.title;
  $("what").textContent = s.what || "";
  $("check").innerHTML = ""; (s.check || []).forEach((c) => { const li = document.createElement("li"); li.textContent = c; $("check").appendChild(li); });
  $("stage").hidden = isNote; $("note").hidden = !isNote;

  else { const want = "screens/" + s.id + ".html?mode=" + LOOK.mode; if (shown !== want) { shown = want; $("frame").src = want; } }

  $("prev").href = "#" + ALL[(i + ALL.length - 1) % ALL.length].id; $("next").href = "#" + ALL[(i + 1) % ALL.length].id;
  fit();
}
paint(); addEventListener("hashchange", show); addEventListener("resize", fit); show();
